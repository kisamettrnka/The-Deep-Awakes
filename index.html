<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Temné moře</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="fishing-minigame.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=EB+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
</head>
<body>

  <div id="hud">
    <aside id="hud-left">
      <div id="region">The Marrows</div>
      <p id="quest">Seber všechny relikvie <span id="relics">0 / 6</span></p>
      <div id="stats-mini">
        <span>🐟 <span id="fish">0</span></span>
        <span>⚠ <span id="danger">0</span></span>
      </div>
    </aside>

    <div id="hud-center">
      <div id="time-dial">
        <span id="day-label">Den 12</span>
        <span id="clock">07:45</span>
      </div>
    </div>

    <aside id="hud-right">
      <div id="money"><span class="currency">$</span><span id="gold">0</span></div>
    </aside>
  </div>

  <div id="hud-bottom">
    <div id="keys-hint"><kbd>A</kbd> <kbd>D</kbd> plavba · u bublin <kbd>SPACE</kbd> rybaření</div>
  </div>

<div id="fishing-ui" class="hidden" aria-hidden="true">
  <div class="fishing-panel">
    <div class="fishing-col fishing-progress-col">
      <div class="v-gauge">
        <div class="v-gauge-water" aria-hidden="true"></div>
        <div class="v-gauge-track"></div>
        <div id="catch-fish-icon" class="catch-fish-icon" aria-hidden="true"></div>
      </div>
    </div>

    <div class="fishing-col fishing-ring-col">
      <svg id="fishing-ring-svg" viewBox="0 0 200 200" role="img" aria-label="Rybaření">
        <defs>
          <filter id="wood-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.5"/>
          </filter>
        </defs>
        <!-- tmavý tělocvičný kruh (červenohnědý = zbytek) -->
        <circle cx="100" cy="100" r="72" fill="none" stroke="#4a2528" stroke-width="22" filter="url(#wood-shadow)"/>
        <path id="fishing-green-arcs" fill="none" stroke="#29c46a" stroke-width="22" stroke-linecap="round"/>
        <g id="fishing-needle" transform="translate(100 100)">
          <polygon points="0,-62 -7,-44 7,-44" fill="#f5f5f5"/>
        </g>
        <circle cx="100" cy="100" r="26" fill="#0c0e10"/>
        <path id="fishing-center-fish" fill="#eaeaea" d="M100 88c8 0 14 6 14 14s-6 14-14 14c-6 0-11-3-13-8l-12 4 2-10c-2-2-3-5-3-8 0-8 6-14 14-14z"/>
      </svg>
    </div>

    <div class="fishing-col fishing-info-col">
      <h2 id="fishing-title">Narušená voda</h2>
      <p class="fishing-stock">Zásoby: <span id="fishing-stock-val" class="stock-high">Vysoká</span></p>
      <span class="fishing-tag">POBŘEŽÍ</span>
      <p class="fishing-instruct">Ve správný okamžik stiskni <kbd>SPACE</kbd> — jen ve <strong>zeleném</strong> oblouku.</p>
      <p id="fishing-red-hint" class="fishing-red-hint hidden">Chyby v řadě: <span id="fishing-red-count">0</span> / 3</p>
      <p id="fishing-result" class="fishing-result hidden"></p>
    </div>
  </div>
</div>

<canvas id="game"></canvas>

<script src="game.js"></script>
</body>
</html>
